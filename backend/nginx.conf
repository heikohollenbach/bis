events {}

http {
  upstream web {
    server bis-web-service:8080;
  }

  upstream auth {
    server bis-auth-service:8080;
  }

  upstream player {
    server bis-player-service:8080;
  }

  upstream world {
    server bis-world-service:8080;
  }

  upstream chat {
    server bis-chat-service:8080;
  }

  server {
    listen 80;

    location / {
      rewrite ^/(.*)$ /$1 break;
      proxy_pass http://web;
    }

    location /api/auth/ {
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://auth;
    }

    location /api/player/ {
      rewrite ^/api/player/(.*)$ /$1 break;
      proxy_pass http://player;
    }

    location /api/world/ {
      rewrite ^/api/world/(.*)$ /$1 break;
      proxy_pass http://world;
    }

    location /api/chat/ {
      rewrite ^/api/chat/(.*)$ /$1 break;
      proxy_pass http://chat;
    }
  }
}
