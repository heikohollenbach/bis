events {}

http {
  upstream auth {
    server bis-auth-service:8080;
  }

  upstream player {
    server bis-player-service:8080;
  }

  upstream world {
    server bis-world-service:8080;
  }

  upstream chat {
    server bis-chat-service:8080;
  }

  server {
    listen 80;

    location /auth/ {
      rewrite ^/auth/(.*)$ /$1 break;
      proxy_pass http://auth;
    }

    location /player/ {
      rewrite ^/player/(.*)$ /$1 break;
      proxy_pass http://player;
    }

    location /world/ {
      rewrite ^/world/(.*)$ /$1 break;
      proxy_pass http://world;
    }

    location /chat/ {
      rewrite ^/chat/(.*)$ /$1 break;
      proxy_pass http://chat;
    }
  }
}