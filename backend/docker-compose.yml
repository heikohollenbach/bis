services:

  nginx:
    image: nginx:1.30-alpine
    container_name: bis-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - player-service
      - world-service
      - chat-service

  postgres:
    image: postgres:18.3-alpine
    container_name: bis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bis_auth
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.2-alpine
    container_name: bis-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: bis-auth-service:1.0.0
    container_name: bis-auth-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=bis_auth;User Id=postgres;Password=postgres;
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  player-service:
    image: bis-player-service:1.0.0
    container_name: bis-player-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=bis_player;User Id=postgres;Password=postgres;
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  world-service:
    image: bis-world-service:1.0.0
    container_name: bis-world-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=bis_world;User Id=postgres;Password=postgres;
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.world.rule=PathPrefix(`/world`)"
      - "traefik.http.routers.world.entrypoints=web"
      - "traefik.http.middlewares.world-strip.stripprefix.prefixes=/world"
      - "traefik.http.routers.world.middlewares=world-strip"
      - "traefik.http.services.world.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-service:
    image: bis-chat-service:1.0.0
    container_name: bis-chat-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=bis_chat;User Id=postgres;Password=postgres;
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: bis-network
